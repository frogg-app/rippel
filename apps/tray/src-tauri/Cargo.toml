[package]
name = "rippel-tray"
version = "0.4.2"
description = "The rippel agent's tray panel"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde_json = "1"
# Plain HTTP to the agent on 127.0.0.1 only, so no TLS stack.
ureq = { version = "2", default-features = false, features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
