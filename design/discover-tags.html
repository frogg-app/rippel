<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rippel · Discover (tags mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@300;400;500&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --mist:#c4e2e4;--foam:#9ccfd8;--tide:#6a97a8;--pine:#31748f;
  --ground:#0d1014;--ground-sunken:#0a0e11;--panel:#12181c;
  --surface-2:rgba(220,238,242,.03);--surface-3:rgba(220,238,242,.045);--surface-hover:rgba(220,238,242,.08);
  --line:rgba(220,238,242,.07);--line-strong:rgba(220,238,242,.1);--line-input:rgba(220,238,242,.13);
  --text:#dceef2;--text-2:#c3d6db;--text-3:#9fb3ba;--text-4:#8ba0a6;--text-muted:#7f959c;
  --accent:#9ccfd8;--accent-ink:#0d1014;--accent-tint:rgba(156,207,216,.12);--accent-line:rgba(156,207,216,.3);
  --ok:#6fd39a;--ok-text:#8adcae;--ok-tint:rgba(111,211,154,.16);
  --warn:#f6c177;--danger-text:#f2a2b8;--info:#b5a3d4;--info-tint:rgba(181,163,212,.14);
  --font-ui:'Epilogue',system-ui,sans-serif;--font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font:400 13px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-4)}

/* ---- top ---- */
.top{display:flex;align-items:center;gap:22px;height:60px;padding:0 28px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px}
.tab{padding:7px 12px;border-radius:8px;color:var(--text-3)}
.tab.on{background:var(--surface-3);color:var(--text)}
.wrap{display:grid;grid-template-columns:248px 1fr;height:calc(100vh - 60px)}

/* ---- facet rail ---- */
.rail{border-right:1px solid var(--line);padding:18px 18px 40px;overflow:auto}
.facet{margin-bottom:20px}
.facet h4{margin:0 0 8px}
.frow{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;border-radius:7px;color:var(--text-2);text-align:left}
.frow:hover{background:var(--surface-hover)}
.frow.on{background:var(--accent-tint);color:var(--accent)}
.frow .n{margin-left:auto;color:var(--text-muted);font-size:11px}
.frow .ic{width:16px;text-align:center;opacity:.85}
.more{color:var(--text-4);font-size:12px;padding:4px 8px}

/* ---- main ---- */
main{overflow:auto;padding:20px 28px 60px}
.search{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line-input);border-radius:11px;background:var(--surface-2);position:relative}
.search:focus-within{border-color:var(--accent-line)}
.search input{flex:1;min-width:200px;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:13.5px;padding:4px}
.token{display:inline-flex;align-items:center;gap:6px;padding:3px 6px 3px 9px;border-radius:7px;background:var(--accent-tint);border:1px solid var(--accent-line);color:var(--accent);font-size:12px}
.token .k{color:var(--text-4)}
.token button{opacity:.7;padding:0 3px}.token button:hover{opacity:1}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line-strong);border-radius:11px;padding:6px;z-index:5;box-shadow:0 18px 40px rgba(0,0,0,.45);display:none}
.suggest.open{display:block}
.suggest .s{display:flex;gap:10px;align-items:center;padding:7px 9px;border-radius:7px;width:100%;text-align:left}
.suggest .s:hover,.suggest .s.hl{background:var(--surface-hover)}
.suggest .s .g{color:var(--text-4);font-size:11px;width:72px}
.suggest .s .n{margin-left:auto;color:var(--text-muted);font-size:11px}
.bar{display:flex;align-items:center;gap:14px;margin:14px 0 18px;color:var(--text-3);font-size:12px}
.bar .sp{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:5px 10px;color:var(--text-3)}.seg button.on{background:var(--surface-3);color:var(--text)}
.hint{color:var(--text-muted);font-size:11.5px;margin-top:6px}
.hint code{font-family:var(--font-mono);color:var(--text-3)}

/* ---- tag chip (HF-style) ---- */
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text-2);font-size:11.5px;white-space:nowrap;cursor:pointer;transition:background .12s,border-color .12s}
.chip:hover{background:var(--surface-hover);border-color:var(--line-input)}
.chip.on{background:var(--accent-tint);border-color:var(--accent-line);color:var(--accent)}
.chip .ic{font-size:11px;opacity:.9}
.chip.task{color:var(--text)}
.chip.lic .k{color:var(--text-4)}
.chip.ghost{color:var(--text-4);border-style:dashed}

/* ---- grid + card ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface-2);transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-2px);border-color:var(--line-strong)}
.art{aspect-ratio:16/10;position:relative;cursor:pointer}
.art .type{position:absolute;left:10px;top:10px;padding:3px 8px;border-radius:6px;background:rgba(8,12,16,.6);backdrop-filter:blur(10px);font-size:11px;color:var(--text)}
.art .inst{position:absolute;right:10px;top:10px;padding:3px 8px;border-radius:6px;background:var(--ok-tint);color:var(--ok-text);font-size:11px}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
.name{margin:0;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name .org{color:var(--text-4);font-weight:400}
.stats{display:flex;gap:12px;color:var(--text-3);font-size:11.5px}
.tags{display:flex;flex-wrap:wrap;gap:5px;max-height:49px;overflow:hidden}
.verdict{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text-3);margin-top:auto}
.verdict b{font-weight:500;padding:2px 7px;border-radius:5px;font-size:11px}
.v-ok b{background:var(--ok-tint);color:var(--ok-text)}
.v-warn b{background:rgba(246,193,119,.14);color:var(--warn)}
.v-no b{background:rgba(235,111,146,.12);color:var(--danger-text)}
.act{display:flex;gap:8px}
.btn{flex:1;height:32px;border-radius:9px;border:1px solid var(--line-input);color:var(--text-2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border:0;font-weight:500}
.btn:hover{filter:brightness(1.1)}

/* ---- detail drawer ---- */
.scrim{position:fixed;inset:0;background:rgba(6,9,12,.66);display:none;z-index:9}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:560px;background:var(--panel);border-left:1px solid var(--line-strong);transform:translateX(100%);transition:transform .25s;z-index:10;overflow:auto}
.drawer.open{transform:none}
.drawer .art{aspect-ratio:16/9;cursor:default}
.dbody{padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.dtitle{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:300}
.dtitle .org{color:var(--text-4)}
.like{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;font-size:12px;overflow:hidden}
.like span{padding:3px 8px}.like span+span{border-left:1px solid var(--line-strong);color:var(--text-3)}
.dtags{display:flex;flex-wrap:wrap;gap:6px}
.dtags .chip{height:26px;font-size:12px;padding:0 10px}
.dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:12px}
.dl dt{color:var(--text-4)}.dl dd{margin:0;color:var(--text-2)}
.note{border:1px dashed var(--line-input);border-radius:10px;padding:10px 12px;color:var(--text-3);font-size:12px}
.empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--text-4)}
</style>
</head>
<body>

<div class="top">
  <strong style="font-weight:300;font-size:19px">Models</strong>
  <div class="tabs"><button class="tab">Installed</button><button class="tab on">Discover</button><button class="tab">Downloads</button><button class="tab">Storage</button></div>
  <span style="flex:1"></span>
  <span class="label">Backend</span><span style="color:var(--text-2)">desktop-4090 · <span class="mono">24 GB</span></span>
</div>

<div class="wrap">
  <aside class="rail" id="rail"></aside>
  <main>
    <div class="search" id="search">
      <span id="tokens" style="display:contents"></span>
      <input id="q" placeholder="Search models, or type a tag…" autocomplete="off">
      <div class="suggest" id="suggest"></div>
    </div>
    <div class="hint">Click any tag to filter · <code>tag:</code> <code>task:</code> <code>base:</code> <code>license:</code> in the box · <code>-tag</code> to exclude</div>
    <div class="bar">
      <span id="count"></span>
      <span class="sp"></span>
      <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="fits" checked> Runs on this backend</label>
      <div class="seg" id="sort"><button class="on" data-s="downloads">Downloads</button><button data-s="likes">Likes</button><button data-s="name">Name</button></div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>

<script>
const ICON = {task:'◧',library:'⬡',format:'◈',language:'◍',license:'⚖',base:'△'};
const GROUP_LABEL = {task:'Task',base:'Base model',library:'Library',format:'Format',license:'Licence',language:'Language',tag:'Tags'};

const M = [
 {org:'black-forest-labs',name:'FLUX.1-dev',type:'Checkpoint',hue:28,dl:2140000,likes:10400,size:'23.8 GB',v:'ok',vt:'Runs · fp8 fits in 24 GB',inst:true,
  tags:{task:['text-to-image'],base:['flux.1'],library:['diffusers'],format:['safetensors'],license:['flux-1-dev-non-commercial'],language:['english'],tag:['photorealistic','typography','guidance-distilled','12B']}},
 {org:'stabilityai',name:'stable-diffusion-xl-base-1.0',type:'Checkpoint',hue:200,dl:3120000,likes:6500,size:'6.9 GB',v:'ok',vt:'Runs',
  tags:{task:['text-to-image'],base:['sdxl'],library:['diffusers'],format:['safetensors'],license:['openrail++'],language:['english'],tag:['stable-diffusion','base-model','1024px']}},
 {org:'Wan-AI',name:'Wan2.2-T2V-A14B',type:'Checkpoint',hue:290,dl:418000,likes:2900,size:'28.6 GB',v:'warn',vt:'Needs offload · slow on 24 GB',
  tags:{task:['text-to-video'],base:['wan2.2'],library:['diffusers'],format:['safetensors'],license:['apache-2.0'],language:['english','chinese'],tag:['video','mixture-of-experts','720p','long-context']}},
 {org:'Lykon',name:'dreamshaper-xl-lightning',type:'Checkpoint',hue:340,dl:286000,likes:1900,size:'6.9 GB',v:'ok',vt:'Runs',
  tags:{task:['text-to-image'],base:['sdxl'],library:['diffusers'],format:['safetensors'],license:['openrail++'],language:['english'],tag:['anime','fantasy','lightning','4-step','merge']}},
 {org:'XLabs-AI',name:'flux-RealismLora',type:'LoRA',hue:48,dl:96000,likes:1200,size:'22 MB',v:'ok',vt:'Runs with FLUX.1-dev',
  tags:{task:['text-to-image'],base:['flux.1'],library:['diffusers'],format:['safetensors'],license:['flux-1-dev-non-commercial'],language:['english'],tag:['lora','photorealistic','skin-detail']}},
 {org:'Kijai',name:'WanVideo_comfy',type:'Checkpoint',hue:262,dl:1300000,likes:1700,size:'14.3 GB',v:'ok',vt:'Runs · fp8 scaled',
  tags:{task:['image-to-video'],base:['wan2.1'],library:['comfyui'],format:['safetensors','gguf'],license:['apache-2.0'],language:['english','chinese'],tag:['video','quantized','fp8','i2v']}},
 {org:'lllyasviel',name:'ControlNet-v1-1',type:'ControlNet',hue:160,dl:640000,likes:3900,size:'1.4 GB',v:'ok',vt:'Runs with any SD 1.5',
  tags:{task:['image-to-image'],base:['sd1.5'],library:['diffusers'],format:['safetensors'],license:['openrail'],language:['english'],tag:['controlnet','depth','canny','openpose','lineart']}},
 {org:'tencent',name:'HunyuanVideo-I2V',type:'Checkpoint',hue:12,dl:58000,likes:860,size:'51.2 GB',v:'no',vt:'Won’t fit · needs ~60 GB',
  tags:{task:['image-to-video'],base:['hunyuan-video'],library:['diffusers'],format:['safetensors'],license:['tencent-hunyuan-community'],language:['english','chinese'],tag:['video','13B','high-vram']}},
 {org:'city96',name:'FLUX.1-schnell-gguf',type:'Checkpoint',hue:36,dl:212000,likes:760,size:'6.8 GB',v:'ok',vt:'Runs · Q8_0',
  tags:{task:['text-to-image'],base:['flux.1'],library:['gguf'],format:['gguf'],license:['apache-2.0'],language:['english'],tag:['quantized','4-step','fast','low-vram']}},
 {org:'Comfy-Org',name:'umt5_xxl_fp8',type:'Text encoder',hue:190,dl:880000,likes:310,size:'6.7 GB',v:'ok',vt:'Used by Wan models',
  tags:{task:['feature-extraction'],base:['wan2.1'],library:['comfyui'],format:['safetensors'],license:['apache-2.0'],language:['multilingual'],tag:['text-encoder','fp8']}},
 {org:'Kwai-Kolors',name:'Kolors',type:'Checkpoint',hue:320,dl:74000,likes:1100,size:'11.2 GB',v:'ok',vt:'Runs',
  tags:{task:['text-to-image'],base:['kolors'],library:['diffusers'],format:['safetensors'],license:['apache-2.0'],language:['chinese','english'],tag:['photorealistic','bilingual','typography']}},
 {org:'nerijs',name:'pixel-art-xl',type:'LoRA',hue:100,dl:41000,likes:690,size:'170 MB',v:'ok',vt:'Runs with SDXL',
  tags:{task:['text-to-image'],base:['sdxl'],library:['diffusers'],format:['safetensors'],license:['creativeml-openrail-m'],language:['english'],tag:['lora','pixel-art','style','game-assets']}},
];

const state = {inc:[], exc:[], text:'', sort:'downloads', fits:true};
const key = (g,v)=>g+':'+v;
const flat = m => Object.entries(m.tags).flatMap(([g,vs])=>vs.map(v=>({g,v})));
const fmt = n => n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'k':n;

function matches(m, skip){
  const ks = new Set(flat(m).map(t=>key(t.g,t.v)));
  if (state.fits && m.v==='no') return false;
  for (const t of state.inc) if (t!==skip && !ks.has(t)) return false;
  for (const t of state.exc) if (ks.has(t)) return false;
  if (state.text){
    const s = state.text.toLowerCase();
    if (!(m.org+'/'+m.name).toLowerCase().includes(s) && ![...ks].some(k=>k.split(':')[1].includes(s))) return false;
  }
  return true;
}
function counts(){
  const c = {};
  for (const m of M) for (const t of flat(m)) {
    const k = key(t.g,t.v);
    if (matches(m, k)) c[k]=(c[k]||0)+1;
  }
  return c;
}
function chip(g,v,extra=''){
  const k = key(g,v), on = state.inc.includes(k);
  const ic = ICON[g] ? `<span class="ic">${ICON[g]}</span>` : '';
  const label = g==='license' ? `<span class="k">License:</span> ${v}` : v;
  return `<span class="chip ${g==='task'?'task':''} ${g==='license'?'lic':''} ${on?'on':''} ${extra}" data-k="${k}">${ic}${label}</span>`;
}
function cardTags(m){
  // Order on the card: task first, then base, then free tags; library/format/licence live in the drawer.
  const ts = [...m.tags.task.map(v=>['task',v]), ...m.tags.base.map(v=>['base',v]), ...m.tags.tag.map(v=>['tag',v])];
  const shown = ts.slice(0,5), rest = flat(m).length - shown.length;
  return shown.map(([g,v])=>chip(g,v)).join('') + (rest>0?`<span class="chip ghost" data-open>+${rest}</span>`:'');
}
function art(m){
  return `background:radial-gradient(120% 100% at 32% 24%, hsl(${m.hue} 62% 62%) 0%, hsl(${(m.hue+28)%360} 48% 28%) 55%, var(--ground-sunken) 100%)`;
}
function render(){
  const list = M.filter(m=>matches(m)).sort((a,b)=> state.sort==='name'? a.name.localeCompare(b.name) : state.sort==='likes'? b.likes-a.likes : b.dl-a.dl);
  document.getElementById('count').innerHTML = `<span class="mono">${list.length}</span> of <span class="mono">${M.length}</span> models`;
  document.getElementById('grid').innerHTML = list.length ? list.map((m,i)=>`
    <article class="card" data-i="${M.indexOf(m)}">
      <div class="art" style="${art(m)}" data-open><span class="type">${m.type}</span>${m.inst?'<span class="inst">✓ Installed</span>':''}</div>
      <div class="body">
        <h3 class="name"><span class="org">${m.org}/</span>${m.name}</h3>
        <div class="stats"><span>♡ <span class="mono">${fmt(m.likes)}</span></span><span>↓ <span class="mono">${fmt(m.dl)}</span></span><span class="mono">${m.size}</span></div>
        <div class="tags">${cardTags(m)}</div>
        <div class="verdict v-${m.v}"><b>${m.v==='ok'?'Runs':m.v==='warn'?'Tight':'Too big'}</b>${m.vt}</div>
        <div class="act">${m.inst?'<button class="btn">Workflows</button>':`<button class="btn pri">Install</button><button class="btn" style="flex:0 0 auto;padding:0 12px">Workflows</button>`}</div>
      </div>
    </article>`).join('') : `<div class="empty">Nothing matches. Remove a tag above.</div>`;

  // tokens
  document.getElementById('tokens').innerHTML = [...state.inc.map(k=>[k,false]),...state.exc.map(k=>[k,true])].map(([k,neg])=>{
    const [g,v]=k.split(':');
    return `<span class="token" style="${neg?'background:rgba(235,111,146,.1);border-color:rgba(235,111,146,.28);color:var(--danger-text)':''}"><span class="k">${neg?'−':''}${g}:</span>${v}<button data-rm="${k}">×</button></span>`;
  }).join('');

  // rail
  const c = counts();
  const groups = ['task','base','tag','license','format','language'];
  document.getElementById('rail').innerHTML = groups.map(g=>{
    const vals = [...new Set(M.flatMap(m=>m.tags[g]))].map(v=>[v,c[key(g,v)]||0]).filter(([v,n])=>n||state.inc.includes(key(g,v))).sort((a,b)=>b[1]-a[1]);
    const lim = g==='tag'?10:6;
    return `<div class="facet"><h4 class="label">${GROUP_LABEL[g]}</h4>${vals.slice(0,lim).map(([v,n])=>`
      <button class="frow ${state.inc.includes(key(g,v))?'on':''}" data-k="${key(g,v)}"><span class="ic">${ICON[g]||'#'}</span>${v}<span class="n mono">${n}</span></button>`).join('')}
      ${vals.length>lim?`<div class="more">+ ${vals.length-lim} more</div>`:''}</div>`;
  }).join('');
}
function toggle(k){ const i=state.inc.indexOf(k); i<0?state.inc.push(k):state.inc.splice(i,1); render(); }

// search box: tag autocomplete
const q = document.getElementById('q'), sug = document.getElementById('suggest');
const ALL = [...new Map(M.flatMap(flat).map(t=>[key(t.g,t.v),t])).values()];
let hl = 0, opts = [];
function suggest(){
  let s = q.value.trim().toLowerCase(), neg = s.startsWith('-'); if (neg) s=s.slice(1);
  let g = null; const m = s.match(/^(\w+):(.*)$/); if (m){ g=m[1]; s=m[2]; }
  if (!s && !g){ sug.classList.remove('open'); return; }
  const c = counts();
  opts = ALL.filter(t=>(!g||t.g===g) && t.v.includes(s) && !state.inc.includes(key(t.g,t.v))).sort((a,b)=>(c[key(b.g,b.v)]||0)-(c[key(a.g,a.v)]||0)).slice(0,7).map(t=>({...t,neg}));
  hl = 0;
  sug.innerHTML = (opts.length?opts.map((t,i)=>`<button class="s ${i===0?'hl':''}" data-pick="${i}"><span class="g">${neg?'exclude ':''}${GROUP_LABEL[t.g]}</span>${chip(t.g,t.v)}<span class="n mono">${c[key(t.g,t.v)]||0}</span></button>`).join(''):'')
    + (!g?`<button class="s" data-text><span class="g">Text</span>Search names for “${q.value}”</button>`:'');
  sug.classList.add('open');
}
function pick(i){ const t=opts[i]; (t.neg?state.exc:state.inc).push(key(t.g,t.v)); q.value=''; state.text=''; sug.classList.remove('open'); render(); }
q.addEventListener('input', suggest);
q.addEventListener('keydown', e=>{
  const items=[...sug.querySelectorAll('.s')];
  if (e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); hl=(hl+(e.key==='ArrowDown'?1:-1)+items.length)%items.length; items.forEach((el,i)=>el.classList.toggle('hl',i===hl)); }
  else if (e.key==='Enter'){ if (hl<opts.length) pick(hl); else { state.text=q.value.trim(); q.value=''; sug.classList.remove('open'); render(); } }
  else if (e.key==='Backspace' && !q.value){ state.exc.length?state.exc.pop():state.inc.pop(); render(); }
  else if (e.key==='Escape') sug.classList.remove('open');
});

// drawer
const drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim');
function open(m){
  const order=['task','library','format','language','base','tag','license'];
  drawer.innerHTML = `
    <div class="art" style="${art(m)}"><span class="type">${m.type}</span></div>
    <div class="dbody">
      <div class="dtitle"><span><span class="org">${m.org}/</span><span class="mono" style="font-weight:500">${m.name}</span></span>
        <span class="like"><span>♡ Like</span><span class="mono">${fmt(m.likes)}</span></span></div>
      <div class="dtags">${order.flatMap(g=>m.tags[g].map(v=>chip(g,v))).join('')}</div>
      <div class="verdict v-${m.v}" style="margin:0"><b>${m.v==='ok'?'Runs':m.v==='warn'?'Tight':'Too big'}</b>${m.vt} on desktop-4090</div>
      <dl class="dl"><dt>Size</dt><dd class="mono">${m.size}</dd><dt>Downloads</dt><dd class="mono">${m.dl.toLocaleString()}</dd><dt>Source</dt><dd>huggingface.co/${m.org}/${m.name}</dd></dl>
      <div class="act">${m.inst?'<button class="btn">Open workflows</button>':'<button class="btn pri">Install</button><button class="btn">Workflows</button>'}</div>
      <div class="note">Every tag here is clickable — it closes the drawer and filters Discover by it.</div>
    </div>`;
  drawer.classList.add('open'); scrim.classList.add('open');
}
function close(){ drawer.classList.remove('open'); scrim.classList.remove('open'); }
scrim.onclick=close;

document.addEventListener('click', e=>{
  const rm=e.target.closest('[data-rm]'); if (rm){ const k=rm.dataset.rm; state.inc=state.inc.filter(x=>x!==k); state.exc=state.exc.filter(x=>x!==k); render(); return; }
  const p=e.target.closest('[data-pick]'); if (p){ pick(+p.dataset.pick); return; }
  if (e.target.closest('[data-text]')){ state.text=q.value.trim(); q.value=''; sug.classList.remove('open'); render(); return; }
  const o=e.target.closest('[data-open]'); if (o){ open(M[+o.closest('.card').dataset.i]); return; }
  const c=e.target.closest('[data-k]'); if (c){ if (drawer.contains(c)) close(); toggle(c.dataset.k); return; }
  const s=e.target.closest('#sort button'); if (s){ state.sort=s.dataset.s; document.querySelectorAll('#sort button').forEach(b=>b.classList.toggle('on',b===s)); render(); return; }
  if (!e.target.closest('#search')) sug.classList.remove('open');
});
document.getElementById('fits').onchange=e=>{ state.fits=e.target.checked; render(); };

state.inc=['task:text-to-image'];
render();
</script>
</body>
</html>
